name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  integrity_checks:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Integrity Checks
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Run integrity checks
        uses: ./.github/actions/run-integrity-checks

  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: integrity_checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_MUSHROOM_03DA43703 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

      - name: Build deployment report
        if: github.event_name == 'pull_request'
        id: deploy_report
        shell: bash
        run: |
          deploy_status="${{ steps.builddeploy.outcome }}"
          report_sha="${{ github.event.pull_request.head.sha }}"
          report_branch="${{ github.event.pull_request.head.ref }}"
          short_sha="$(printf '%s' "$report_sha" | cut -c1-8)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          updated_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          preview_url="${{ steps.builddeploy.outputs.static_web_app_url }}"
          report_path="${RUNNER_TEMP}/deploy-report.md"
          if [ "$deploy_status" = "success" ]; then
            status_icon="🚀"
            status_line="Azure Static Web Apps deployment completed successfully."
          else
            status_icon="❌"
            status_line="Azure Static Web Apps deployment failed."
          fi

          {
            echo "<!-- pr-health-deploy:start -->"
            echo "<!-- deploy-meta status=${deploy_status} sha=${short_sha} -->"
            echo "## ${status_icon} Azure Deploy"
            echo
            echo "> __DEPLOY_CHANGE_SUMMARY__"
            echo
            echo "${status_line}"
            echo
            echo "- Branch: \`${report_branch}\`"
            echo "- Commit: \`${short_sha}\`"
            echo "- Updated: ${updated_at}"
            echo "- Workflow run: [Open run](${run_url})"
            if [ -n "$preview_url" ]; then
              echo "- Preview URL: [Open preview](${preview_url})"
            fi
            echo
            echo "<!-- pr-health-deploy:end -->"
          } > "$report_path"

          echo "deploy_status=${deploy_status}" >> "$GITHUB_OUTPUT"
          echo "report_path=${report_path}" >> "$GITHUB_OUTPUT"

      - name: Comment deployment report on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.deploy_report.outputs.report_path }}
        with:
          script: |
            const fs = require('fs');
            let sectionBody = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const rootMarker = '<!-- pr-health-report -->';
            const legacyMarker = '<!-- integrity-check-report -->';
            const sectionStart = '<!-- pr-health-deploy:start -->';
            const sectionEnd = '<!-- pr-health-deploy:end -->';
            const metaPattern = /<!-- deploy-meta status=(\w+) sha=([0-9a-f]+) -->/;

            const upsertSection = (body, startMarker, endMarker, nextSection) => {
              const startIndex = body.indexOf(startMarker);
              const endIndex = body.indexOf(endMarker);
              if (startIndex >= 0 && endIndex >= 0 && endIndex >= startIndex) {
                return `${body.slice(0, startIndex)}${nextSection}${body.slice(endIndex + endMarker.length)}`.trim();
              }
              return `${body.trim()}\n\n${nextSection}`.trim();
            };

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot'
                && typeof comment.body === 'string'
                && (comment.body.includes(rootMarker) || comment.body.includes(legacyMarker)),
            );
            const currentMetaMatch = sectionBody.match(metaPattern);
            const currentMeta = currentMetaMatch ? {
              status: currentMetaMatch[1],
              sha: currentMetaMatch[2],
            } : null;
            const previousMetaMatch = existing?.body?.match(metaPattern);
            const previousMeta = previousMetaMatch ? {
              status: previousMetaMatch[1],
              sha: previousMetaMatch[2],
            } : null;

            const humanizeStatus = (value) => {
              if (value === 'success') return 'succeeded';
              if (value === 'failure') return 'failed';
              return value || 'unknown';
            };

            const changeLines = [];
            if (!previousMeta || !currentMeta) {
              changeLines.push('First Azure deployment report for this pull request.');
            } else if (previousMeta.status !== currentMeta.status) {
              changeLines.push(`Azure deploy changed from ${humanizeStatus(previousMeta.status)} to ${humanizeStatus(currentMeta.status)}.`);
            } else {
              changeLines.push(`No deployment status change since commit \`${previousMeta.sha}\`.`);
            }

            sectionBody = sectionBody.replace('__DEPLOY_CHANGE_SUMMARY__', changeLines.join(' '));
            const baseBody = existing?.body?.includes(rootMarker)
              ? existing.body
              : [
                rootMarker,
                '## PR Health Report',
                '',
                '_This comment is updated automatically with the latest integrity and deployment status for this pull request._',
              ].join('\n');
            const nextBody = upsertSection(baseBody, sectionStart, sectionEnd, sectionBody);
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: nextBody,
              });
            }

      - name: Fail job if deployment failed
        if: steps.builddeploy.outcome != 'success'
        shell: bash
        run: |
          echo "Azure deployment failed."
          exit 1

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_MUSHROOM_03DA43703 }}
          action: "close"
