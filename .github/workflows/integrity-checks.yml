name: Integrity Checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  integrity_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    name: API And SQL Integrity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Lint API
        id: lint_api
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint:api 2>&1 | tee api-lint.log

      - name: Validate setup SQL
        id: lint_sql
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint:sql 2>&1 | tee sql-lint.log

      - name: Build integrity report
        id: report
        shell: bash
        run: |
          api_status="${{ steps.lint_api.outcome }}"
          sql_status="${{ steps.lint_sql.outcome }}"
          report_sha="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          report_branch="${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
          short_sha="$(printf '%s' "$report_sha" | cut -c1-8)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          updated_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          if [ "$api_status" = "success" ] && [ "$sql_status" = "success" ]; then
            overall_status="success"
            status_icon="✅"
            status_line="All integrity checks passed."
          else
            overall_status="failure"
            status_icon="❌"
            status_line="One or more integrity checks failed."
          fi

          {
            echo "<!-- pr-health-integrity:start -->"
            echo "<!-- integrity-meta api=${api_status} sql=${sql_status} overall=${overall_status} sha=${short_sha} -->"
            echo "## ${status_icon} Integrity Checks"
            echo
            echo "> __CHANGE_SUMMARY__"
            echo
            echo "${status_line}"
            echo
            echo "- Branch: \`${report_branch}\`"
            echo "- Commit: \`${short_sha}\`"
            echo "- Updated: ${updated_at}"
            echo "- Workflow run: [Open run](${run_url})"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| API lint | ${api_status} |"
            echo "| SQL lint | ${sql_status} |"
            echo
            echo "<details><summary>API lint output</summary>"
            echo
            echo '```text'
            tail -n 200 api-lint.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>SQL lint output</summary>"
            echo
            echo '```text'
            tail -n 200 sql-lint.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<!-- pr-health-integrity:end -->"
          } > integrity-report.md

          echo "overall_status=${overall_status}" >> "$GITHUB_OUTPUT"

      - name: Upload integrity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-check-logs
          path: |
            api-lint.log
            sql-lint.log
            integrity-report.md

      - name: Comment report on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: integrity-report.md
        with:
          script: |
            const fs = require('fs');
            let sectionBody = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const rootMarker = '<!-- pr-health-report -->';
            const legacyMarker = '<!-- integrity-check-report -->';
            const sectionStart = '<!-- pr-health-integrity:start -->';
            const sectionEnd = '<!-- pr-health-integrity:end -->';
            const metaPattern = /<!-- integrity-meta api=(\w+) sql=(\w+) overall=(\w+) sha=([0-9a-f]+) -->/;

            const upsertSection = (body, startMarker, endMarker, nextSection) => {
              const startIndex = body.indexOf(startMarker);
              const endIndex = body.indexOf(endMarker);
              if (startIndex >= 0 && endIndex >= 0 && endIndex >= startIndex) {
                return `${body.slice(0, startIndex)}${nextSection}${body.slice(endIndex + endMarker.length)}`.trim();
              }
              return `${body.trim()}\n\n${nextSection}`.trim();
            };

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot'
                && typeof comment.body === 'string'
                && (comment.body.includes(rootMarker) || comment.body.includes(legacyMarker)),
            );
            const currentMetaMatch = sectionBody.match(metaPattern);
            const currentMeta = currentMetaMatch ? {
              api: currentMetaMatch[1],
              sql: currentMetaMatch[2],
              overall: currentMetaMatch[3],
              sha: currentMetaMatch[4],
            } : null;
            const previousMetaMatch = existing?.body?.match(metaPattern);
            const previousMeta = previousMetaMatch ? {
              api: previousMetaMatch[1],
              sql: previousMetaMatch[2],
              overall: previousMetaMatch[3],
              sha: previousMetaMatch[4],
            } : null;

            const humanizeCheck = (value) => {
              if (value === 'success') return 'passed';
              if (value === 'failure') return 'failed';
              return value || 'unknown';
            };

            const changeLines = [];
            if (!previousMeta || !currentMeta) {
              changeLines.push('First integrity report for this pull request.');
            } else {
              if (previousMeta.api !== currentMeta.api) {
                changeLines.push(`API lint changed from ${humanizeCheck(previousMeta.api)} to ${humanizeCheck(currentMeta.api)}.`);
              }
              if (previousMeta.sql !== currentMeta.sql) {
                changeLines.push(`SQL lint changed from ${humanizeCheck(previousMeta.sql)} to ${humanizeCheck(currentMeta.sql)}.`);
              }
              if (!changeLines.length) {
                changeLines.push(`No status change since commit \`${previousMeta.sha}\`.`);
              }
            }

            sectionBody = sectionBody.replace('__CHANGE_SUMMARY__', changeLines.join(' '));
            const baseBody = existing?.body?.includes(rootMarker)
              ? existing.body
              : [
                rootMarker,
                '## PR Health Report',
                '',
                '_This comment is updated automatically with the latest integrity and deployment status for this pull request._',
              ].join('\n');
            const nextBody = upsertSection(baseBody, sectionStart, sectionEnd, sectionBody);
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: nextBody,
              });
            }

      - name: Fail job if integrity checks failed
        if: steps.report.outputs.overall_status != 'success'
        shell: bash
        run: |
          echo "Integrity checks failed."
          exit 1
