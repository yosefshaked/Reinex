name: Integrity Checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  integrity_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    name: API And SQL Integrity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        id: lint_api
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint:api 2>&1 | tee api-lint.log

      - name: Validate setup SQL
        id: lint_sql
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint:sql 2>&1 | tee sql-lint.log

      - name: Build integrity report
        id: report
        shell: bash
        run: |
          api_status="${{ steps.lint_api.outcome }}"
          sql_status="${{ steps.lint_sql.outcome }}"
          if [ "$api_status" = "success" ] && [ "$sql_status" = "success" ]; then
            overall_status="success"
            status_icon="✅"
            status_line="All integrity checks passed."
          else
            overall_status="failure"
            status_icon="❌"
            status_line="One or more integrity checks failed."
          fi

          {
            echo "<!-- integrity-check-report -->"
            echo "## ${status_icon} Integrity Checks"
            echo
            echo "${status_line}"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| API lint | ${api_status} |"
            echo "| SQL lint | ${sql_status} |"
            echo
            echo "<details><summary>API lint output</summary>"
            echo
            echo '```text'
            tail -n 200 api-lint.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>SQL lint output</summary>"
            echo
            echo '```text'
            tail -n 200 sql-lint.log
            echo '```'
            echo
            echo "</details>"
          } > integrity-report.md

          echo "overall_status=${overall_status}" >> "$GITHUB_OUTPUT"

      - name: Upload integrity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-check-logs
          path: |
            api-lint.log
            sql-lint.log
            integrity-report.md

      - name: Comment report on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: integrity-report.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- integrity-check-report -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && typeof comment.body === 'string' && comment.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail job if integrity checks failed
        if: steps.report.outputs.overall_status != 'success'
        shell: bash
        run: |
          echo "Integrity checks failed."
          exit 1
